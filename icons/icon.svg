<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="70%">
      <stop offset="0" stop-color="#8e3140"/>
      <stop offset="0.6" stop-color="#5a1823"/>
      <stop offset="1" stop-color="#2e0c12"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2dc98"/>
      <stop offset="0.5" stop-color="#d4ae55"/>
      <stop offset="1" stop-color="#9a7428"/>
    </linearGradient>
    <clipPath id="clip"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <!-- sunburst rays from the horizon -->
    <g fill="#c9a24a" opacity="0.16">
      <path d="M256 430 L-40 120 L20 60 Z"/><path d="M256 430 L60 20 L140 0 Z"/>
      <path d="M256 430 L210 -10 L302 -10 Z"/><path d="M256 430 L372 0 L452 20 Z"/>
      <path d="M256 430 L492 60 L552 120 Z"/>
    </g>
    <!-- rails -->
    <rect x="0" y="430" width="512" height="10" fill="#c9a24a" opacity="0.55"/>
    <rect x="0" y="452" width="512" height="6" fill="#c9a24a" opacity="0.3"/>
  </g>
  <!-- double deco frame -->
  <rect x="26" y="26" width="460" height="460" rx="92" fill="none" stroke="url(#brass)" stroke-width="12"/>
  <rect x="48" y="48" width="416" height="416" rx="74" fill="none" stroke="#c9a24a" stroke-width="3" opacity="0.55"/>
  <!-- geometric L -->
  <path d="M150 104 H236 V328 H362 V400 H150 Z" fill="url(#brass)"/>
  <path d="M150 104 H236 V112 H158 V392 H150 Z" fill="#fff4cf" opacity="0.45"/>
  <!-- pocket watch on its chain, hanging from the L -->
  <path d="M236 150 Q300 150 320 196" fill="none" stroke="#e8cf86" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 12"/>
  <circle cx="328" cy="208" r="11" fill="none" stroke="url(#brass)" stroke-width="7"/>
  <circle cx="332" cy="268" r="50" fill="url(#brass)"/>
  <circle cx="332" cy="268" r="38" fill="#f4e9d3"/>
  <circle cx="332" cy="268" r="38" fill="none" stroke="#9a7428" stroke-width="3"/>
  <path d="M332 268 V242 M332 268 L350 278" stroke="#2a1c14" stroke-width="6" stroke-linecap="round"/>
  <circle cx="332" cy="268" r="5" fill="#6e1f2b"/>
</svg>
