<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1a1210">
<meta name="description" content="LIFT — a stealth-puzzle adventure about a gentleman thief aboard vintage passenger trains.">
<title>LIFT</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="LIFT">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Limelight&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Josefin+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="The train"></canvas>
  <div id="hud" hidden></div>
  <div id="screen"></div>
  <canvas id="mini" hidden></canvas>
  <div id="miniUi" hidden><button class="btn ghost" id="miniAbort">Back off</button></div>
  <div id="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><div class="noscript">LIFT needs JavaScript to run.</div></noscript>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
